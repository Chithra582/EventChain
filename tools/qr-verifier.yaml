name: qr-verifier
description: Authenticate entry QR code token and check on-chain redemption status.
input_schema:
  type: object
  properties:
    token_id:
      type: integer
      description: Unique token identifier of the ERC-721 ticket.
    signature:
      type: string
      description: ECDSA cryptographic signature generated by the holder wallet.
    timestamp:
      type: integer
      description: Unix timestamp of the dynamic QR generation event.
  required:
    - token_id
    - signature
    - timestamp
